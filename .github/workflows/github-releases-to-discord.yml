name: Publish release to Discord

on:
  workflow_run:
    workflows: ["Build & Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  github-releases-to-discord:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Get release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE="$(gh release view --json name,body,url)"
          DELIMITER="$(openssl rand -hex 16)"
          {
            echo "name<<$DELIMITER"
            jq -r '.name' <<< "$RELEASE"
            echo "$DELIMITER"
            echo "body<<$DELIMITER"
            jq -r '.body // ""' <<< "$RELEASE"
            echo "$DELIMITER"
            echo "url<<$DELIMITER"
            jq -r '.url' <<< "$RELEASE"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"
      - name: GitHub Releases to Discord
        uses: SethCohen/github-releases-to-discord@v1
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          release_name: ${{ steps.release.outputs.name }}
          release_body: ${{ steps.release.outputs.body }}
          release_html_url: ${{ steps.release.outputs.url }}
          color: "2105893"
          username: "Auto Releases"
          avatar_url: "https://i.pinimg.com/736x/1a/e3/12/1ae312bbacceb8f39546b4157f6f6c4c.jpg"
          content: "<@&1472222634208006204>"
          footer_title: "Changelog"
          reduce_headings: true
